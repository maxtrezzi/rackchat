# Example RackChat configuration.
#
# This is a modelrack4j configuration file (ADR-0004): RackChat does not define a format of
# its own. Every block under `llm` becomes one connection you can pick in the chat page.
#
# Copy this file to rackchat.conf, keep your keys in environment variables, and start the
# backend. RackChat watches the file, so editing it while the server runs updates the
# connection list without a restart.
#
# `${VAR}` is mandatory substitution: loading fails loudly when the variable is unset. Do not
# change it to `${?VAR}`, which silently yields no value and turns a missing key into an
# authentication error at the first request instead.
#
# Model names are plain strings and are not validated against a list, so check them against
# your own account's access.
llm {

  # A streamed connection: `streaming = true` is what makes modelrack4j build a
  # StreamingChatModel, and RackChat streams the answer token by token when it finds one.
  fast {
    description = "quick answers, streamed"
    provider    = openai
    api-key     = ${OPENAI_API_KEY}
    model-name  = "gpt-5.1"
    streaming   = true
    timeout     = 60s
  }

  # Without `streaming`, the answer arrives in one piece. RackChat sends it as a single frame.
  careful {
    description = "one answer, no streaming, twenty turns of memory"
    provider    = anthropic
    api-key     = ${ANTHROPIC_API_KEY}
    model-name  = "claude-sonnet-5"
    timeout     = 120s
    memory { type = message-window, max-messages = 20 }
  }
}
